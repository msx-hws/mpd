services:
  web:
    build: .
    container_name: mpd-web
    ports:
      - "${HOST_PORT:-80}:5001"
    volumes:
      - ./files:/app/files
      - ./app:/app/app:ro
      - ./wsgi.py:/app/wsgi.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
    env_file:
      - .env
    restart: unless-stopped
